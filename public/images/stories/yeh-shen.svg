<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="chineseDawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="60%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#chineseDawn)"/>
  
  <!-- Bamboo Stems -->
  <rect x="180" y="0" width="18" height="630" fill="#15803d"/>
  <rect x="220" y="0" width="14" height="630" fill="#16a34a"/>
  <rect x="1000" y="0" width="16" height="630" fill="#15803d"/>
  <rect x="1030" y="0" width="12" height="630" fill="#16a34a"/>
  
  <!-- Lotus Pond & Golden Fish -->
  <ellipse cx="600" cy="480" rx="360" ry="110" fill="#0284c7" opacity="0.4"/>
  <ellipse cx="600" cy="480" rx="340" ry="90" fill="#38bdf8" opacity="0.6"/>

  <!-- Golden Slipper on Lotus Leaf -->
  <g transform="translate(540, 410) scale(1.2)">
    <ellipse cx="50" cy="50" rx="60" ry="24" fill="#15803d"/>
    <!-- Golden Slipper with fish scale embroidery -->
    <path d="M 25 45 Q 40 20 65 24 Q 90 28 98 44 Q 70 48 45 46 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <circle cx="95" cy="43" r="3" fill="#ef4444"/>
    <polygon points="60,10 63,16 69,18 63,20 60,26 57,20 51,18 57,16" fill="#f59e0b"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="50" width="600" height="90" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#f59e0b" stroke-width="2"/>
  <text x="80" y="90" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#fef3c7">Yeh-Shen: The Folk Cinderella</text>
  <text x="80" y="122" font-family="system-ui, sans-serif" font-size="18" fill="#fde68a">Chinese Folktales • The Golden Fish &amp; Gentle Heart</text>
</svg>
